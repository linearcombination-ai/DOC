services:
  redis:
    image: redis:latest
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  usfmparserapi:
    image: wycliffeassociates/doc-usfmparser:${IMAGE_TAG}
    environment:
      IMAGE_TAG: ${IMAGE_TAG:-local}
    ports:
      - ${DOTNET_API_PORT:-8081}:80
    volumes:
      - shared_assets:/app/assets_download
      - shared_working:/app/working_temp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health/status"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
  api:
    image: wycliffeassociates/doc:${IMAGE_TAG}
    env_file:
      - .env
    environment:
      DATA_API_URL: ${DATA_API_URL:-https://api.bibleineverylanguage.org/v1/graphql}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      FROM_EMAIL_ADDRESS: ${FROM_EMAIL_ADDRESS}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SEND_EMAIL: ${SEND_EMAIL}
    ports:
      - ${API_HOST_PORT:-5005}:5005
    command: gunicorn --name doc:entrypoints:app --worker-class uvicorn.workers.UvicornWorker --pythonpath /app/backend --conf /app/backend/gunicorn.conf.py doc.entrypoints.app:app
    volumes:
      - shared:/app/document_output
      - shared_assets:/app/assets_download
    depends_on:
      usfmparserapi:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/health/status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
  worker:
    image: wycliffeassociates/doc:${IMAGE_TAG}
    # One worker per CPU core unless RQ_WORKERS is set, matching the
    # old Celery default. PreloadedWorker imports the job modules once
    # in the parent so forked job processes don't re-import them.
    command: >-
      sh -c 'exec rq worker-pool --url "$$REDIS_URL"
      --num-workers "$${RQ_WORKERS:-$$(nproc)}"
      --worker-class doc.domain.rq_worker.PreloadedWorker'
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RQ_WORKERS: ${RQ_WORKERS:-}
      FROM_EMAIL_ADDRESS: ${FROM_EMAIL_ADDRESS}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
    volumes:
      - shared:/app/document_output
      - shared_working:/app/working_temp
      - shared_assets:/app/assets_download
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys; from redis import Redis; from rq import Worker; sys.exit(0 if Worker.count(connection=Redis.from_url(os.environ['REDIS_URL'])) else 1)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
  rq-dashboard:
    image: wycliffeassociates/doc:${IMAGE_TAG}
    command: gunicorn --bind 0.0.0.0:9181 --workers 1 doc.dashboard:app
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Optional HTTP basic auth. The dashboard is read-only (see
      # backend/doc/dashboard.py) but still shows job arguments and results.
      RQ_DASHBOARD_USERNAME: ${RQ_DASHBOARD_USERNAME:-}
      RQ_DASHBOARD_PASSWORD: ${RQ_DASHBOARD_PASSWORD:-}
    ports:
      - ${RQ_DASHBOARD_HOST_PORT:-9181}:9181
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
  fileserver:
    build: ./web
    ports:
      - ${FILESERVER_HOST_PORT:-8089}:80
    volumes:
      - shared:/srv/content
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
  frontend:
    image: wycliffeassociates/doc-ui:${IMAGE_TAG}
    environment:
      PUBLIC_BACKEND_API_URL: ${PUBLIC_BACKEND_API_URL:-http://localhost:5005}
      PUBLIC_FILE_SERVER_URL: ${PUBLIC_FILE_SERVER_URL:-http://localhost:8089}
      PUBLIC_LOGROCKET_ID: ${PUBLIC_LOGROCKET_ID:-ct7zyg/bible-in-every-language}
    ports:
      - ${FRONTEND_HOST_PORT:-8001}:80
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
      fileserver:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  shared:
  shared_working:
  shared_assets:
