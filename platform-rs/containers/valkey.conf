# Valkey for the DOC platform stack. State is small (job hashes, counters, locks, email records); what matters is that a
# restart or a crash does not lose queued jobs: append-only file, fsync every second (at most one second of state is
# lost on a hard crash), no eviction (a full memory is an error, never a silent loss of a job).
bind 0.0.0.0
protected-mode no
port 6379
dir /data
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 16mb
save ""
maxmemory 192mb
maxmemory-policy noeviction
loglevel notice
