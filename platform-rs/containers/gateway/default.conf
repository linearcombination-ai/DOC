# The gateway: DOC's nginx idea (nginx/default.conf and web/default.conf), adapted so DOC's existing URLs, paths and ports
# reach the new service. Two listeners, the two origins DOC's UI is configured with:
#
#   :5005  the API (PUBLIC_BACKEND_API_URL)  ->  api:8081   (the Rust shell; CORS is answered there, as FastAPI did)
#   :8089  the document files (PUBLIC_FILE_SERVER_URL)  ->  the shared output volume, read-only (DOC's `web` fileserver)
#
# The SvelteKit frontend (:8001) is DOC's own image and is not proxied here: its routes (/resource_types, /books ...)
# overlap with API paths, which is why DOC serves the UI and the API on separate ports.

upstream doc_api {
  server api:8081 max_fails=0;
  keepalive 16;
}

map $http_x_request_id $req_id {
  default $http_x_request_id;
  ""      $request_id;
}

# JSON access log: one line per request, with the request id that the service also logs.
log_format doc_json escape=json '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"urt":"$upstream_response_time","request_id":"$req_id"}';
access_log /dev/stdout doc_json;
error_log  /dev/stderr warn;

server {
  listen 5005;
  server_name _;
  server_tokens off;
  client_max_body_size 128k;          # the service's own limit is 64 KiB; this is only a belt
  client_body_timeout 30s;

  # The gateway's own liveness; the API's is /health/status.
  location = /gateway/health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # DOC's FastAPI interactive docs are not part of the migrated surface (the UI's nginx answers 404 for them too).
  location ~ ^/(docs|redoc)(/|$) { return 404; }

  location / {
    proxy_pass http://doc_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $req_id;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;          # a POST only enqueues; polling is short
    proxy_redirect off;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
    add_header X-Request-Id $req_id always;
  }
}

server {
  listen 8089;
  server_name _;
  server_tokens off;
  root /app/document_output;

  location = /gateway/health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Scratch directories of running jobs and the janitor's files are never served.
  location ~ /\. { return 404; }

  location / {
    # DOC's fileserver lists the directory (autoindex); the UI links straight to <key>.<ext>.
    autoindex on;
    autoindex_exact_size off;
    autoindex_format html;
    autoindex_localtime on;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-cache" always;
    types {
      application/vnd.openxmlformats-officedocument.wordprocessingml.document docx;
      application/pdf pdf;
      text/html html;
      application/json json;
    }
    default_type application/octet-stream;
  }
}
