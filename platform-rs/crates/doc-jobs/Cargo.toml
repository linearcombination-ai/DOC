[package]
name = "doc-jobs"
description = "P5: the job runner that would replace Celery: store (Redis Streams or in-memory), runner, DOC pipeline stages, the Python docx seam, the HTTP routes."
version.workspace = true
edition.workspace = true
publish.workspace = true
[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "time", "sync", "signal", "fs", "io-util", "net"] }
tracing.workspace = true
futures.workspace = true
rand.workspace = true
axum.workspace = true
doc-contract.workspace = true
doc-model.workspace = true
doc-lookup.workspace = true
doc-ports.workspace = true
doc-app.workspace = true
doc-request = { path = "../doc-request" }
doc-interleave = { path = "../doc-interleave" }
doc-md = { path = "../doc-md" }
doc-acquire.workspace = true
doc-canon = { path = "../doc-canon" }
redis = { version = "1.8", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "connection-manager", "script", "streams"] }
base64 = "0.23"
rustls = "0.23"
rustls-pki-types = "1"
rustls-native-certs = "0.8"
tokio-rustls = "0.26"
nix = { version = "0.31", default-features = false, features = ["signal", "process", "fs"] }

[dev-dependencies]
doc-catalog.workspace = true
doc-shell = { path = "../doc-shell" }
reqwest.workspace = true
tempfile = "3"
