[package]
name = "doc-md"
description = "Markdown readers, link transformers, markdown engine adapter, name localizer."
version.workspace = true
edition.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
doc-model = { path = "../doc-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fancy-regex = "0.14"
comrak = { version = "0.40", default-features = false }
unicode-general-category = "1"
