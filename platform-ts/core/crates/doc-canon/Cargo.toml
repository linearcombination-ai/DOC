[package]
name = "doc-canon"
description = "The only crate that imports scripture-kitchen (names today; USFM, Writer stitching later in P3)."
version.workspace = true
edition.workspace = true
publish.workspace = true
[lints]
workspace = true

# kitchen is public: https://github.com/WycliffeAssociates/scripture-kitchen, examined at
# 0090c0beb19cfbd8e08b963a48ae2caeeb339821 (tag v0.1.24). Path dependency on a read-only clone;
# the pinned forms DOC would use are
#   canon = { git = "https://github.com/WycliffeAssociates/scripture-kitchen", tag = "v0.1.24" }
# or a vendored subtree (the fork seam).
[dependencies]
canon = { path = "../../../vendor/kitchen/canon" }
doc-model = { path = "../doc-model" }
doc-interleave = { path = "../doc-interleave" }
serde_json = "1"
fancy-regex = "0.16"
unicode-general-category = "1"
usfm_onion = { path = "../../../vendor/kitchen/onion" }
bttwriter = { path = "../../../vendor/kitchen/bttwriter" }
mise = { path = "../../../vendor/kitchen/mise" }
