# Valkey for the job queue (BullMQ), status strings, metrics counters, worker heartbeats, clone locks and email records.
# Reachable only on the compose network (no host port is published). See docs/RUNBOOK.md "Redis persistence".
bind 0.0.0.0
protected-mode no
port 6379
dir /data
# durability: a crash or kill -9 loses at most about one second of queue writes
appendonly yes
appendfsync everysec
# no RDB snapshots beside the AOF (the AOF is the record)
save ""
# BullMQ keys must never be evicted
maxmemory-policy noeviction
# keep clients that died from holding memory
timeout 0
tcp-keepalive 60
