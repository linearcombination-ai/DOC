# The gateway: DOC's own URLs and ports in front of the TypeScript build.
#   :5005  DOC's API port     -> the api container (every DOC path: /documents, /documents_docx, /task_status/..., the lookups, /health/status)
#   :8089  DOC's file server  -> the shared output volume (DOC's web/default.conf: autoindex, read only)
# Derived from DOC's nginx/default.conf and web/default.conf. The frontend (:8001) is DOC's own image and is not proxied here.
# Docker's embedded DNS (127.0.0.11) is queried at request time, so the gateway survives the api container being restarted with a new address.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 30s;
  resolver 127.0.0.11 valid=5s ipv6=off;

  # one request id per request: the caller's X-Request-Id when it sent one, else nginx's own
  map $http_x_request_id $doc_request_id { default $http_x_request_id; "" $request_id; }
  log_format doc '$remote_addr "$request" $status $body_bytes_sent rt=$request_time urt=$upstream_response_time rid=$doc_request_id';
  access_log /dev/stdout doc;

  server {
    listen 5005;
    server_name _;
    client_max_body_size 1m;
    # the API itself validates and bounds requests; this only stops absurd bodies earlier
    location = /gateway-health { default_type text/plain; return 200 "ok\n"; }
    location / {
      set $doc_api http://api:18301;
      proxy_pass $doc_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Request-Id $doc_request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 120s;
      proxy_send_timeout 60s;
      proxy_redirect off;
    }
  }

  server {
    listen 8089;
    server_name _;
    root /srv/content;
    # half-written files (the worker writes <name>.part then renames) are never listed or served
    location ~ \.part$ { return 404; }
    location / {
      autoindex on;
      autoindex_exact_size off;
      autoindex_format html;
      autoindex_localtime on;
      add_header Access-Control-Allow-Origin * always;
      add_header Cache-Control "no-cache" always;
    }
  }
}
