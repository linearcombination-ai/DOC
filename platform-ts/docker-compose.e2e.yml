# Override for the CI end-to-end runs against THIS stack:
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml --profile e2e run --rm -T test-runner
# The test runner is DOC's own API image (built from DOC's Dockerfile with only the Calibre step and the mypy lines removed:
# ci/make-baseline-dockerfile.sh), so DOC's tests import their own `doc` package unchanged. The pytest plugin tools/e2e/doc_e2e_shim.py points DOC's
# TestClient at the gateway instead of an in-process app. DOC's tests then look for the finished document in /app/document_output, which is this
# stack's output volume (read only). Same marker expression, same xdist and pytest-split flags as DOC's own CI (docker-compose.api-test.yml).
# Only tests/e2e/doc runs: STET and Passages (tests/e2e/stet, tests/e2e/passages) are out of scope in this phase and are listed as excluded.
services:
  test-runner:
    profiles: ["e2e"]
    image: wycliffeassociates/doc:${IMAGE_TAG:-local}
    depends_on:
      gateway:
        condition: service_healthy
      worker:
        condition: service_healthy
    working_dir: /app
    entrypoint: pytest
    command:
      - -p
      - doc_e2e_shim
      - -vv
      - --tb=short
      - --log-cli-level=INFO
      - -m
      - not all and not randomized and not english_randomized
      - -n
      - ${PYTEST_WORKERS:-auto}
      - --splits
      - ${PYTEST_SPLITS:-1}
      - --group
      - ${PYTEST_GROUP:-1}
      - --durations-path
      - /app/tests/.test_durations
      - --junitxml=/results/junit.xml
      - -o
      - junit_family=xunit2
      - /app/tests/e2e/doc
    environment:
      E2E_BASE_URL: http://gateway:5005
      E2E_TIMEOUT_SECONDS: "180"
      PYTHONPATH: /shim:/app/backend:/app/tests:/app
      PYTHONDONTWRITEBYTECODE: "1"
      FROM_EMAIL_ADDRESS: ${FROM_EMAIL_ADDRESS:-foo@example.com}
      SMTP_PASSWORD: fakepass
      SMTP_HOST: smtp.example.com
      SMTP_PORT: "111"
      SEND_EMAIL: "False"
    volumes:
      - ./tools/e2e:/shim:ro
      # nocopy matters: without it the first mount copies the image's /app/document_output ownership (DOC's appuser) into the still-empty volume,
      # and the worker (uid 1000) can no longer write its documents (found in CI run 5: every job failed with EACCES at placement)
      - type: volume
        source: output
        target: /app/document_output
        read_only: true
        volume:
          nocopy: true
      - ./e2e-results:/results
