# DOC platform experiment, Rust build (branch exp/platform-rs on the fork). Builds the images on the runner only (no registry push, no secrets),
# runs the Rust and Python checks, brings the compose stack up and proves it, then runs DOC's own end-to-end tests against it and against DOC's
# FastAPI + Celery stack in the same run (see platform-rs/docs/P7-PLAN.md, section 4).
#
# Which jobs run: a push runs `static`, `rust` and `stack` (build + smoke). Markers in the head commit message add more: [e2e] the API end-to-end
# jobs on both stacks, [e2e-ui] the frontend tests on both stacks, [ops] the operations scenarios, [all] everything. workflow_dispatch takes the
# `jobs` input instead (it only works for a workflow file on the default branch, so on this experiment branch the markers are the way).
#
# The CI scripts under platform-rs/ci (wait-healthy, smoke, ops, loadgen, e2e_table, stats) and the shape of the end-to-end jobs follow the
# TypeScript build's (data/doc-full-ts), which found the volume-ownership and Calibre problems first; what was taken is listed in the report.
name: platform-rs

on:
  push:
    branches:
      - exp/platform-rs
      - exp/platform-rs/**
  workflow_dispatch:
    inputs:
      jobs:
        description: "Which jobs: all, static, rust, stack (build + smoke), e2e-api, e2e-ui, ops (a comma list also works)"
        required: false
        default: all

# A newer push cancels an older plain run on the same ref; a run that carries an end-to-end marker in its commit message is never cancelled by a
# later push (its own group), because those runs take tens of minutes.
concurrency:
  group: platform-rs-${{ github.ref }}-${{ contains(github.event.head_commit.message, '[e2e') && github.sha || 'plain' }}
  cancel-in-progress: ${{ !contains(github.event.head_commit.message, '[e2e') }}

permissions:
  contents: read

env:
  RUST_VERSION: "1.100.0"
  KITCHEN_REF: v0.1.24
  KITCHEN_REPO: https://github.com/WycliffeAssociates/scripture-kitchen

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      static: ${{ steps.sel.outputs.static }}
      rust: ${{ steps.sel.outputs.rust }}
      stack: ${{ steps.sel.outputs.stack }}
      e2e_api: ${{ steps.sel.outputs.e2e_api }}
      e2e_ui: ${{ steps.sel.outputs.e2e_ui }}
      ops: ${{ steps.sel.outputs.ops }}
    steps:
      - id: sel
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.jobs }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then want="${INPUT:-all}"; else
            want="static,rust,stack"
            case "$MSG" in *"[all]"*) want="all";; esac
            case "$MSG" in *"[e2e]"*) want="$want,e2e-api";; esac
            case "$MSG" in *"[e2e-ui]"*) want="$want,e2e-ui";; esac
            case "$MSG" in *"[ops]"*) want="$want,ops";; esac
          fi
          has() { case ",$want," in *,all,*|*,"$1",*) echo true;; *) echo false;; esac; }
          # the stack job (build + smoke) is also needed by every end-to-end job
          stack=$(has stack); [ "$(has e2e-api)" = true ] && stack=true; [ "$(has e2e-ui)" = true ] && stack=true; [ "$(has ops)" = true ] && stack=true
          {
            echo "static=$(has static)"; echo "rust=$(has rust)"; echo "stack=$stack"
            echo "e2e_api=$(has e2e-api)"; echo "e2e_ui=$(has e2e-ui)"; echo "ops=$(has ops)"
          } >> "$GITHUB_OUTPUT"
          echo "selected: $want" | tee -a "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------------------------------------------------------
  # Static checks: Dockerfile lint, compose files against the compose-spec schema and `docker compose config`, the workflow itself, mypy --strict.
  # ---------------------------------------------------------------------------------------------------------------------------------------------
  static:
    name: Static checks
    needs: [plan]
    if: ${{ needs.plan.outputs.static == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install linters
        run: |
          curl -fsSL -o /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          chmod +x /usr/local/bin/hadolint
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar -xz -C /usr/local/bin actionlint
          pip install --quiet mypy==2.4.1 jsonschema pyyaml types-jsonschema types-PyYAML fastapi httpx weasyprint
      - name: hadolint
        working-directory: platform-rs
        run: |
          for f in containers/core.Dockerfile containers/pyworker.Dockerfile containers/gateway/Dockerfile; do echo "== $f"; hadolint --config .hadolint.yaml "$f"; done
      - name: actionlint
        run: actionlint .github/workflows/platform-rs.yml
      - name: compose files (schema and docker compose config)
        working-directory: platform-rs
        run: |
          curl -fsSL https://raw.githubusercontent.com/compose-spec/compose-spec/main/schema/compose-spec.json -o "$RUNNER_TEMP/compose-spec.json"
          python ci/check_compose.py "$RUNNER_TEMP/compose-spec.json" docker-compose.yml docker-compose.e2e.yml ci/baseline-e2e.yml ci/docker-compose.doc-baseline.yml ci/docker-compose.doc-ui-baseline.yml
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml config --quiet
      - name: shell scripts
        working-directory: platform-rs
        run: |
          for f in ci/*.sh scripts/*.sh; do bash -n "$f"; done
          shellcheck --severity=warning ci/*.sh
      - name: mypy --strict, no typing.Any
        working-directory: platform-rs
        run: |
          MYPYPATH=python/docx mypy --strict python/seam_server.py python/docx_worker.py python/pdf_worker.py e2e/e2e_remote.py ci/check_compose.py ci/e2e_table.py ci/loadgen.py ci/stats_summary.py
          python ci/check_no_any.py python ci e2e scripts

  # ---------------------------------------------------------------------------------------------------------------------------------------------
  # The Rust workspace: clippy, the whole test suite against a real Valkey (the binary the stack runs) and a real Python seam service.
  # ---------------------------------------------------------------------------------------------------------------------------------------------
  rust:
    name: Rust tests (clippy, unit and integration against Valkey)
    needs: [plan]
    if: ${{ needs.plan.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: platform-rs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal -c clippy
          rustup default "$RUST_VERSION"
          rustc --version; cargo --version
      - name: Kitchen (the read-only dependency of the core)
        run: git clone --depth 1 --branch "$KITCHEN_REF" "$KITCHEN_REPO" _exp/kitchen && git -C _exp/kitchen rev-parse HEAD
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            platform-rs/target
          key: cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('platform-rs/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-
      - name: Valkey from the official image (the binary the stack runs) and WeasyPrint for the PDF test
        run: |
          mkdir -p "$HOME/bin"
          cid=$(docker create valkey/valkey:9.2.0)
          docker cp "$cid:/usr/local/bin/valkey-server" "$HOME/bin/valkey-server"
          docker rm "$cid"
          "$HOME/bin/valkey-server" --version
          echo "DOC_SERVER_BIN=$HOME/bin/valkey-server" >> "$GITHUB_ENV"
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 fonts-noto-core > /dev/null
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q weasyprint
          echo "DOC_TEST_PYTHON=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"
      - name: Clippy
        shell: bash
        run: cargo clippy --workspace --all-targets --locked 2>&1 | tee ../clippy.log | tail -30
      - name: Tests
        shell: bash
        run: |
          mkdir -p ../ci-out
          /usr/bin/time -v cargo test --workspace --locked -- --test-threads=2 2>&1 | tee ../ci-out/cargo-test.log | tail -80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-logs
          path: |
            clippy.log
            ci-out
          retention-days: 14

  # ---------------------------------------------------------------------------------------------------------------------------------------------
  # Images: each built once into the runner, saved as a tarball (no registry), size and wall time recorded.
  # ---------------------------------------------------------------------------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.name }} image
    needs: [plan]
    if: ${{ needs.plan.outputs.stack == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            context: .
            file: platform-rs/containers/core.Dockerfile
            tag: doc-rs/core:local
          - name: pyworker
            context: .
            file: platform-rs/containers/pyworker.Dockerfile
            tag: doc-rs/pyworker:local
          - name: gateway
            context: platform-rs/containers/gateway
            file: platform-rs/containers/gateway/Dockerfile
            tag: doc-rs/gateway:local
          - name: frontend
            context: frontend
            file: frontend/Dockerfile
            tag: doc-rs/frontend:local
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Start timer
        run: echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          tags: ${{ matrix.tag }}
          build-args: ${{ matrix.name == 'frontend' && 'PUBLIC_DOC_VERSION_ARG=rs-build' || '' }}
          outputs: type=docker,dest=${{ runner.temp }}/${{ matrix.name }}.tar
          cache-from: type=gha,scope=rs-${{ matrix.name }}
          cache-to: type=gha,scope=rs-${{ matrix.name }},mode=max
      - name: Record build time and image size
        run: |
          end=$(date +%s)
          docker load -i "${{ runner.temp }}/${{ matrix.name }}.tar" >/dev/null
          size=$(docker image inspect --format '{{.Size}}' "${{ matrix.tag }}")
          layers=$(docker image inspect --format '{{len .RootFS.Layers}}' "${{ matrix.tag }}")
          mkdir -p build-info
          printf '{"image":"%s","build_seconds":%s,"size_bytes":%s,"layers":%s,"tar_bytes":%s}\n' \
            "${{ matrix.name }}" "$((end - BUILD_START))" "$size" "$layers" "$(stat -c %s "${{ runner.temp }}/${{ matrix.name }}.tar")" | tee "build-info/${{ matrix.name }}.json"
          echo "| ${{ matrix.name }} | $((end - BUILD_START)) s | $((size / 1048576)) MB | $layers |" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.name }}.tar
          retention-days: 1
          compression-level: 1
      - uses: actions/upload-artifact@v4
        with:
          name: build-info-${{ matrix.name }}
          path: build-info
          retention-days: 14

  # ---------------------------------------------------------------------------------------------------------------------------------------------
  # Smoke: the stack comes up, every health check passes, documents are made (docx, html, pdf through Prince), the UI loads, memory is sampled.
  # ---------------------------------------------------------------------------------------------------------------------------------------------
  smoke:
    name: Stack up, health checks, smoke test
    needs: [plan, build]
    if: ${{ always() && needs.build.result == 'success' && needs.plan.outputs.stack == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - name: Load images
        run: for f in "${{ runner.temp }}"/images/*.tar; do docker load -i "$f"; done
      - name: Gateway configuration (nginx -t inside the gateway image)
        run: docker run --rm --add-host api:127.0.0.1 doc-rs/gateway:local nginx -t
      - name: Start the stack (waits for every health check)
        working-directory: platform-rs
        run: |
          start=$(date +%s)
          docker compose up -d --no-build
          bash ci/wait-healthy.sh 300 valkey pyworker api worker gateway frontend
          echo "up_seconds=$(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Versions (docker, compose, runtimes inside the containers)
        working-directory: platform-rs
        run: |
          mkdir -p ../ci-out
          {
            docker version --format 'docker server {{.Server.Version}} client {{.Client.Version}}'
            docker compose version
            docker compose exec -T pyworker sh -c 'python --version; prince --version | head -1; python -c "import weasyprint; print(\"weasyprint\", weasyprint.__version__)"'
            docker compose exec -T valkey valkey-server --version
            docker compose exec -T api cat /app/kitchen.rev
          } 2>&1 | tee ../ci-out/versions.txt
      - name: Smoke test
        working-directory: platform-rs
        run: |
          mkdir -p ../ci-out
          SMOKE_PRINCE=1 OUT=../ci-out/smoke bash ci/smoke.sh 2>&1 | tee ../ci-out/smoke.txt
      - name: Memory and CPU at rest and after the smoke test
        if: always()
        run: |
          mkdir -p ci-out
          docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.MemPerc}}\t{{.CPUPerc}}\t{{.PIDs}}' | tee ci-out/stats-after-smoke.txt
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep doc-rs | tee ci-out/image-sizes.txt
      - name: Logs
        if: always()
        working-directory: platform-rs
        run: |
          mkdir -p ../ci-out
          docker compose ps -a > ../ci-out/compose-ps.txt
          docker compose logs --no-color --timestamps > ../ci-out/compose-logs.txt 2>&1
      - name: Tear down
        if: always()
        working-directory: platform-rs
        run: docker compose down -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: ci-out
          retention-days: 14

  # ---------------------------------------------------------------------------------------------------------------------------------------------
  # DOC's own end-to-end tests (tests/e2e/doc), on this build's stack and on DOC's FastAPI + Celery baseline, in the same run.
  # ---------------------------------------------------------------------------------------------------------------------------------------------
  build-baseline:
    name: Build DOC ${{ matrix.name }} image (baseline and test runner)
    needs: [plan]
    if: ${{ needs.plan.outputs.e2e_api == 'true' || needs.plan.outputs.e2e_ui == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: generated
            tag: wycliffeassociates/doc:local
          - name: usfmparser
            context: dotnet/USFMParserApi
            file: dotnet/USFMParserApi/Dockerfile
            tag: wycliffeassociates/doc-usfmparser:local
          - name: fileserver
            context: web
            file: web/Dockerfile
            tag: doc-fileserver:latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: DOC's Dockerfile without the Calibre step and the mypy lines
        if: ${{ matrix.name == 'api' }}
        run: bash platform-rs/ci/make-baseline-dockerfile.sh > "${{ runner.temp }}/Dockerfile.baseline"
      - name: Start timer
        run: echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file == 'generated' && format('{0}/Dockerfile.baseline', runner.temp) || matrix.file }}
          tags: ${{ matrix.tag }}
          outputs: type=docker,dest=${{ runner.temp }}/doc-${{ matrix.name }}.tar
          cache-from: type=gha,scope=doc-${{ matrix.name }}
          cache-to: type=gha,scope=doc-${{ matrix.name }},mode=max
      - name: Record build time and image size
        run: |
          end=$(date +%s)
          docker load -i "${{ runner.temp }}/doc-${{ matrix.name }}.tar" >/dev/null
          size=$(docker image inspect --format '{{.Size}}' "${{ matrix.tag }}")
          mkdir -p build-info
          printf '{"image":"doc-%s","build_seconds":%s,"size_bytes":%s}\n' "${{ matrix.name }}" "$((end - BUILD_START))" "$size" | tee "build-info/doc-${{ matrix.name }}.json"
          echo "| doc-${{ matrix.name }} | $((end - BUILD_START)) s | $((size / 1048576)) MB |" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: docimage-${{ matrix.name }}
          path: ${{ runner.temp }}/doc-${{ matrix.name }}.tar
          retention-days: 1
          compression-level: 1
      - uses: actions/upload-artifact@v4
        with:
          name: build-info-doc-${{ matrix.name }}
          path: build-info
          retention-days: 14

  e2e-api-rs:
    name: DOC e2e on the Rust stack (group ${{ matrix.group }}/3)
    needs: [plan, build, build-baseline]
    if: ${{ always() && needs.build.result == 'success' && needs.build-baseline.result == 'success' && needs.plan.outputs.e2e_api == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    env:
      PYTEST_SPLITS: "3"
      PYTEST_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "{image-*,docimage-api}"
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - name: Load images
        run: for f in "${{ runner.temp }}"/images/*.tar; do docker load -i "$f"; done
      - name: Start the stack
        working-directory: platform-rs
        run: |
          mkdir -p -m 0777 e2e-results ../ci-out
          docker compose up -d --no-build valkey pyworker api worker gateway
          bash ci/wait-healthy.sh 300 valkey pyworker api worker gateway
          bash ci/stats-sampler.sh ../ci-out/stats.csv 5 &
      - name: DOC's tests/e2e/doc against the Rust stack
        working-directory: platform-rs
        run: |
          start=$(date +%s)
          set +e
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml --profile e2e run --rm -T test-runner 2>&1 | tee ../ci-out/pytest.txt
          code=${PIPESTATUS[0]}
          echo "pytest_seconds=$(( $(date +%s) - start )) exit=$code" | tee ../ci-out/timing.txt "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Logs and state
        if: always()
        working-directory: platform-rs
        run: |
          mkdir -p ../ci-out
          cp e2e-results/*.xml ../ci-out/ 2>/dev/null || true
          docker compose ps -a > ../ci-out/compose-ps.txt
          docker compose logs --no-color --timestamps > ../ci-out/compose-logs.txt 2>&1
          docker run --rm -v doc-rs_output:/o:ro alpine sh -c 'ls /o | wc -l' > ../ci-out/documents-produced.txt 2>&1 || true
      - name: Tear down
        if: always()
        working-directory: platform-rs
        run: docker compose down -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-rs-${{ matrix.group }}
          path: ci-out
          retention-days: 14

  e2e-api-doc:
    name: DOC e2e on DOC's own FastAPI stack (group ${{ matrix.group }}/3)
    needs: [plan, build-baseline]
    if: ${{ always() && needs.build-baseline.result == 'success' && needs.plan.outputs.e2e_api == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    env:
      IMAGE_TAG: local
      PYTEST_SPLITS: "3"
      PYTEST_GROUP: ${{ matrix.group }}
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.api-test.yml -f platform-rs/ci/docker-compose.doc-baseline.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: docimage-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - name: Load images
        run: for f in "${{ runner.temp }}"/images/*.tar; do docker load -i "$f"; done
      - name: Prepare DOC's compose stack
        run: |
          mkdir -p -m 0777 e2e-results ci-out
          $COMPOSE up --no-start
      - name: DOC's tests/e2e/doc against DOC's own stack
        run: |
          start=$(date +%s)
          set +e
          # `run` starts the test runner's dependencies (waiting for their health checks), runs pytest, leaves the stack up
          ( bash platform-rs/ci/stats-sampler.sh ci-out/stats.csv 5 & echo $! > ci-out/sampler.pid )
          $COMPOSE run --rm -T test-runner 2>&1 | tee ci-out/pytest.txt
          code=${PIPESTATUS[0]}
          echo "pytest_seconds=$(( $(date +%s) - start )) exit=$code" | tee ci-out/timing.txt "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Logs and state
        if: always()
        run: |
          cp e2e-results/*.xml ci-out/ 2>/dev/null || true
          $COMPOSE ps -a > ci-out/compose-ps.txt
          $COMPOSE logs --no-color --timestamps --tail=2000 > ci-out/compose-logs.txt 2>&1
      - name: Tear down
        if: always()
        run: $COMPOSE down -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-doc-${{ matrix.group }}
          path: ci-out
          retention-days: 14

  e2e-report:
    name: DOC e2e pass table
    needs: [e2e-api-rs, e2e-api-doc]
    if: ${{ always() && (needs.e2e-api-rs.result != 'skipped' || needs.e2e-api-doc.result != 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-*-*
          path: results
      - name: Pass table (Rust stack against DOC's FastAPI baseline)
        run: |
          mkdir -p ci-out rs-xml doc-xml
          for d in results/e2e-rs-*; do for x in "$d"/junit*.xml; do [ -f "$x" ] && cp "$x" "rs-xml/$(basename "$d")-$(basename "$x")"; done; done
          for d in results/e2e-doc-*; do for x in "$d"/junit*.xml; do [ -f "$x" ] && cp "$x" "doc-xml/$(basename "$d")-$(basename "$x")"; done; done
          python3 platform-rs/ci/e2e_table.py --rs rs-xml --doc doc-xml --out ci-out/e2e-table.md > /dev/null
          tee -a "$GITHUB_STEP_SUMMARY" < ci-out/e2e-table.md
          python3 platform-rs/ci/stats_summary.py results/e2e-rs-*/stats.csv > ci-out/memory-rs.md || true
          python3 platform-rs/ci/stats_summary.py results/e2e-doc-*/stats.csv > ci-out/memory-doc.md || true
          { echo '### Memory under the e2e load, Rust stack'; cat ci-out/memory-rs.md; echo '### Memory under the e2e load, DOC FastAPI stack'; cat ci-out/memory-doc.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-table
          path: ci-out
          retention-days: 30

  # ---------------------------------------------------------------------------------------------------------------------------------------------
  # DOC's own frontend tests (Playwright, frontend/tests/e2e/doc_test_*.ts; the STET and Passages files are excluded) against this stack and against
  # DOC's own stack, four shards each, as DOC's CI does.
  # ---------------------------------------------------------------------------------------------------------------------------------------------
  build-ui-tests:
    name: Build DOC UI tests image
    needs: [plan]
    if: ${{ needs.plan.outputs.e2e_ui == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/testsDockerfile
          tags: wycliffeassociates/doc-ui-tests:local
          outputs: type=docker,dest=${{ runner.temp }}/ui-tests.tar
          cache-from: type=gha,scope=doc-ui-tests
          cache-to: type=gha,scope=doc-ui-tests,mode=max
      - uses: actions/upload-artifact@v4
        with:
          name: uiimage-tests
          path: ${{ runner.temp }}/ui-tests.tar
          retention-days: 1
          compression-level: 1

  e2e-ui-rs:
    name: DOC frontend tests on the Rust stack (shard ${{ matrix.shard }}/4)
    needs: [plan, build, build-ui-tests]
    if: ${{ always() && needs.build.result == 'success' && needs.build-ui-tests.result == 'success' && needs.plan.outputs.e2e_ui == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "{image-*,uiimage-tests}"
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - name: Load images
        run: for f in "${{ runner.temp }}"/images/*.tar; do docker load -i "$f"; done
      - name: Start the stack
        working-directory: platform-rs
        run: |
          mkdir -p -m 0777 ../ci-out ../e2e-results
          docker compose up -d --no-build
          bash ci/wait-healthy.sh 300 valkey pyworker api worker gateway frontend
          bash ci/stats-sampler.sh ../ci-out/stats.csv 5 &
      - name: DOC's Playwright tests against the Rust stack
        run: |
          start=$(date +%s)
          set +e
          docker run --rm --network host --ipc host -e CI=true -e PLAYWRIGHT_SHARD="${{ matrix.shard }}/4" \
            -e PLAYWRIGHT_JUNIT_OUTPUT_NAME=/results/junit.xml -v "$PWD/e2e-results:/results" wycliffeassociates/doc-ui-tests:local \
            sh -c 'exec npx playwright test --shard="$PLAYWRIGHT_SHARD" --reporter=list,junit doc_test' 2>&1 | tee ci-out/playwright.txt
          code=${PIPESTATUS[0]}
          echo "playwright_seconds=$(( $(date +%s) - start )) exit=$code" | tee ci-out/timing.txt "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Logs and state
        if: always()
        working-directory: platform-rs
        run: |
          cp ../e2e-results/*.xml ../ci-out/ 2>/dev/null || true
          docker compose ps -a > ../ci-out/compose-ps.txt
          docker compose logs --no-color --timestamps > ../ci-out/compose-logs.txt 2>&1
      - name: Tear down
        if: always()
        working-directory: platform-rs
        run: docker compose down -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-rs-${{ matrix.shard }}
          path: ci-out
          retention-days: 14

  e2e-ui-doc:
    name: DOC frontend tests on DOC's own stack (shard ${{ matrix.shard }}/4)
    needs: [plan, build, build-baseline, build-ui-tests]
    if: ${{ always() && needs.build.result == 'success' && needs.build-baseline.result == 'success' && needs.build-ui-tests.result == 'success' && needs.plan.outputs.e2e_ui == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      IMAGE_TAG: local
      PLAYWRIGHT_SHARD: ${{ matrix.shard }}/4
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.frontend-test.yml -f platform-rs/ci/docker-compose.doc-ui-baseline.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "{docimage-*,image-frontend,uiimage-tests}"
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - name: Load images
        run: for f in "${{ runner.temp }}"/images/*.tar; do docker load -i "$f"; done
      - name: DOC's frontend image is the one this stack uses too (built unchanged from frontend/Dockerfile)
        run: docker tag doc-rs/frontend:local wycliffeassociates/doc-ui:local
      - name: Prepare DOC's compose stack
        run: |
          mkdir -p -m 0777 e2e-results ci-out
          $COMPOSE up --no-start
      - name: DOC's Playwright tests against DOC's own stack
        run: |
          start=$(date +%s)
          set +e
          $COMPOSE run --rm -T frontend-test-runner 2>&1 | tee ci-out/playwright.txt
          code=${PIPESTATUS[0]}
          echo "playwright_seconds=$(( $(date +%s) - start )) exit=$code" | tee ci-out/timing.txt "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Logs and state
        if: always()
        run: |
          cp e2e-results/*.xml ci-out/ 2>/dev/null || true
          $COMPOSE ps -a > ci-out/compose-ps.txt
          $COMPOSE logs --no-color --timestamps --tail=2000 > ci-out/compose-logs.txt 2>&1
      - name: Tear down
        if: always()
        run: $COMPOSE down -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-doc-${{ matrix.shard }}
          path: ci-out
          retention-days: 14

  e2e-ui-report:
    name: DOC frontend pass table
    needs: [e2e-ui-rs, e2e-ui-doc]
    if: ${{ always() && (needs.e2e-ui-rs.result != 'skipped' || needs.e2e-ui-doc.result != 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ui-*-*
          path: results
      - name: Pass table (Rust stack against DOC's own stack)
        run: |
          mkdir -p ci-out rs-xml doc-xml
          for d in results/ui-rs-*; do for x in "$d"/junit*.xml; do [ -f "$x" ] && cp "$x" "rs-xml/$(basename "$d")-$(basename "$x")"; done; done
          for d in results/ui-doc-*; do for x in "$d"/junit*.xml; do [ -f "$x" ] && cp "$x" "doc-xml/$(basename "$d")-$(basename "$x")"; done; done
          python3 platform-rs/ci/e2e_table.py --rs rs-xml --doc doc-xml --out ci-out/ui-table.md > /dev/null
          tee -a "$GITHUB_STEP_SUMMARY" < ci-out/ui-table.md
      - uses: actions/upload-artifact@v4
        with:
          name: ui-table
          path: ci-out
          retention-days: 30

  # ---------------------------------------------------------------------------------------------------------------------------------------------
  # Operations in containers (the P6 fault, burst and soak work carried over): limits, SIGTERM drain, SIGKILL mid-job, crash of the Python service,
  # Valkey restart, API crash, 24 documents at once, rollback to another image tag on the same volumes, and a soak with memory sampled per container.
  # ---------------------------------------------------------------------------------------------------------------------------------------------
  ops:
    name: Operations scenarios on the compose stack
    needs: [plan, build]
    if: ${{ always() && needs.build.result == 'success' && needs.plan.outputs.ops == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOAK_MINUTES: "10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - name: Load images
        run: for f in "${{ runner.temp }}"/images/*.tar; do docker load -i "$f"; done
      - name: Start the stack
        working-directory: platform-rs
        run: |
          mkdir -p ../ci-out
          docker compose up -d --no-build
          bash ci/wait-healthy.sh 300 valkey pyworker api worker gateway frontend
          docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.MemPerc}}\t{{.CPUPerc}}\t{{.PIDs}}' | tee ../ci-out/ops-stats-at-rest.txt
      - name: Scenarios
        working-directory: platform-rs
        shell: bash
        run: OUT=../ci-out bash ci/ops.sh 2>&1 | tee ../ci-out/ops.txt
      - name: Summary
        if: always()
        run: |
          { echo '### Operations scenarios'; echo '```'; cat ci-out/ops.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Logs
        if: always()
        working-directory: platform-rs
        run: |
          docker compose ps -a > ../ci-out/compose-ps.txt
          docker compose logs --no-color --timestamps --tail=3000 > ../ci-out/compose-logs.txt 2>&1
      - name: Tear down
        if: always()
        working-directory: platform-rs
        run: docker compose down -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ops-results
          path: ci-out
          retention-days: 14
