# DOC platform experiment, TypeScript build (branch exp/platform-ts on the fork). Builds the images on the runner only (no registry push,
# no secrets), runs the unit and integration tests, brings the compose stack up and proves it. Later milestones add DOC's own end-to-end
# tests and the operations scenarios as further jobs (see platform-ts/docs/P7-PLAN.md, section 4).
name: platform-ts

on:
  push:
    branches:
      - exp/platform-ts
      - exp/platform-ts/**
  workflow_dispatch:
    inputs:
      jobs:
        description: "Which jobs: all, static, unit, stack (build + smoke), e2e-api, e2e-ui, ops (a comma list also works). Note: workflow_dispatch only works for a workflow file on the default branch; on this branch use the commit-message markers instead"
        required: false
        default: all

# A newer push cancels an older plain run on the same ref; a run that carries an end-to-end marker in its commit message is never cancelled by a later push
# (it has its own group), because those runs take tens of minutes.
concurrency:
  group: platform-ts-${{ github.ref }}-${{ contains(github.event.head_commit.message, '[e2e') && github.sha || 'plain' }}
  cancel-in-progress: ${{ !contains(github.event.head_commit.message, '[e2e') }}

permissions:
  contents: read

env:
  NODE_VERSION: "26.13.1"
  RUST_VERSION: "1.100.0"
  WASM_BINDGEN_VERSION: "0.2.130"

jobs:
  # Which jobs run. A push runs static, unit and stack (build + smoke). Markers in the head commit message add more: [e2e] the API end-to-end jobs on
  # both stacks, [e2e-ui] the frontend tests, [ops] the operations scenarios, [all] everything. workflow_dispatch takes the `jobs` input instead.
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      static: ${{ steps.sel.outputs.static }}
      unit: ${{ steps.sel.outputs.unit }}
      stack: ${{ steps.sel.outputs.stack }}
      e2e_api: ${{ steps.sel.outputs.e2e_api }}
      e2e_ui: ${{ steps.sel.outputs.e2e_ui }}
      ops: ${{ steps.sel.outputs.ops }}
    steps:
      - id: sel
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.jobs }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then want="${INPUT:-all}"; else
            want="static,unit,stack"
            case "$MSG" in *"[all]"*) want="all";; esac
            case "$MSG" in *"[e2e]"*) want="$want,e2e-api";; esac
            case "$MSG" in *"[e2e-ui]"*) want="$want,e2e-ui";; esac
            case "$MSG" in *"[ops]"*) want="$want,ops";; esac
          fi
          has() { case ",$want," in *,all,*|*,"$1",*) echo true;; *) echo false;; esac; }
          # the stack job (build + smoke) is also needed by every end-to-end job
          stack=$(has stack); [ "$(has e2e-api)" = true ] && stack=true; [ "$(has e2e-ui)" = true ] && stack=true; [ "$(has ops)" = true ] && stack=true
          {
            echo "static=$(has static)"; echo "unit=$(has unit)"; echo "stack=$stack"
            echo "e2e_api=$(has e2e-api)"; echo "e2e_ui=$(has e2e-ui)"; echo "ops=$(has ops)"
          } >> "$GITHUB_OUTPUT"
          echo "selected: $want" | tee -a "$GITHUB_STEP_SUMMARY"

  static:
    name: Static checks
    needs: [plan]
    if: ${{ needs.plan.outputs.static == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: platform-ts/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install linters
        run: |
          curl -fsSL -o /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          chmod +x /usr/local/bin/hadolint
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar -xz -C /usr/local/bin actionlint
          pip install --quiet mypy==2.4.1 pytest httpx fastapi -r platform-ts/python/requirements.txt
      - name: hadolint
        working-directory: platform-ts
        run: |
          for f in docker/Dockerfile.shell docker/Dockerfile.worker docker/gateway/Dockerfile; do echo "== $f"; hadolint --config .hadolint.yaml "$f"; done
      - name: actionlint
        run: actionlint .github/workflows/platform-ts.yml
      - name: compose files
        working-directory: platform-ts
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml config --quiet
      - name: TypeScript (strict, no emit) and no `any`
        working-directory: platform-ts
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          if grep -rnE ':\s*any\s*[;,)=|>\]\[]|\bas any\b|<any>|\bany\[\]' src test tools scripts --include=*.ts; then echo "found any"; exit 1; fi
      - name: mypy --strict, no typing.Any
        working-directory: platform-ts
        run: |
          MYPY=mypy bash scripts/mypy.sh
          python ci/check_no_any.py python tools ci

  unit:
    name: Unit and integration tests (Valkey)
    needs: [plan]
    if: ${{ needs.plan.outputs.unit == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: platform-ts/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Rust toolchain and wasm target
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
          curl -fsSL "https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz -C /usr/local/bin --strip-components=1 "wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            platform-ts/core/target
          key: cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('platform-ts/core/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-
      - name: Build the wasm core (full, light, fault-injection) and fetch kitchen
        working-directory: platform-ts
        run: |
          bash scripts/fetch-kitchen.sh
          time FAULT=1 CARGO_BUILD_JOBS=4 bash scripts/build-wasm.sh
      - name: Valkey from the official image (the binary the stack runs)
        run: |
          mkdir -p "$HOME/bin"
          cid=$(docker create valkey/valkey:9)
          docker cp "$cid:/usr/local/bin/valkey-server" "$HOME/bin/valkey-server"
          docker cp "$cid:/usr/local/bin/valkey-cli" "$HOME/bin/valkey-cli"
          docker rm "$cid"
          "$HOME/bin/valkey-server" --version
      - name: Python dependencies of the seam
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 fonts-noto-core
          pip install --quiet -r platform-ts/python/requirements.txt
      - name: Install node dependencies
        working-directory: platform-ts
        run: npm ci --no-audit --no-fund
      - name: Run the whole suite
        working-directory: platform-ts
        run: |
          export REDIS_SERVER_BIN="$HOME/bin/valkey-server"
          mkdir -p ../ci-out
          npx vitest run --reporter=verbose --reporter=junit --outputFile.junit=../ci-out/vitest-junit.xml 2>&1 | tee ../ci-out/vitest.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: ci-out
          retention-days: 7

  build:
    name: Build ${{ matrix.name }} image
    needs: [plan]
    if: ${{ needs.plan.outputs.stack == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: platform-ts/docker/Dockerfile.shell
            tag: doc-ts/api:ci
          - name: worker
            context: .
            file: platform-ts/docker/Dockerfile.worker
            tag: doc-ts/worker:ci
          - name: gateway
            context: platform-ts/docker/gateway
            file: platform-ts/docker/gateway/Dockerfile
            tag: doc-ts/gateway:ci
          - name: frontend
            context: frontend
            file: frontend/Dockerfile
            tag: doc-ts/frontend:ci
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Start timer
        run: echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          tags: ${{ matrix.tag }}
          build-args: ${{ matrix.name == 'frontend' && 'PUBLIC_DOC_VERSION_ARG=ts-build' || '' }}
          outputs: type=docker,dest=${{ runner.temp }}/${{ matrix.name }}.tar
          cache-from: type=gha,scope=ts-${{ matrix.name }}
          cache-to: type=gha,scope=ts-${{ matrix.name }},mode=max
      - name: Record build time and image size
        run: |
          end=$(date +%s)
          docker load -i "${{ runner.temp }}/${{ matrix.name }}.tar" >/dev/null
          size=$(docker image inspect --format '{{.Size}}' "${{ matrix.tag }}")
          layers=$(docker image inspect --format '{{len .RootFS.Layers}}' "${{ matrix.tag }}")
          mkdir -p build-info
          printf '{"image":"%s","build_seconds":%s,"size_bytes":%s,"layers":%s,"tar_bytes":%s}\n' \
            "${{ matrix.name }}" "$((end - BUILD_START))" "$size" "$layers" "$(stat -c %s "${{ runner.temp }}/${{ matrix.name }}.tar")" | tee "build-info/${{ matrix.name }}.json"
          echo "| ${{ matrix.name }} | $((end - BUILD_START)) s | $((size / 1048576)) MB | $layers |" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.name }}.tar
          retention-days: 1
          compression-level: 1
      - uses: actions/upload-artifact@v4
        with:
          name: build-info-${{ matrix.name }}
          path: build-info
          retention-days: 14

  smoke:
    name: Stack up, health checks, smoke test
    needs: [plan, build]
    if: ${{ always() && needs.build.result == 'success' && needs.plan.outputs.stack == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - name: Load images
        run: for f in "${{ runner.temp }}"/images/*.tar; do docker load -i "$f"; done
      - name: Start the stack (waits for every health check)
        working-directory: platform-ts
        run: |
          start=$(date +%s)
          docker compose up -d --no-build
          bash ci/wait-healthy.sh 300 valkey api worker gateway frontend
          echo "up_seconds=$(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Smoke test
        working-directory: platform-ts
        run: |
          mkdir -p ../ci-out
          OUT=../ci-out/smoke bash ci/smoke.sh 2>&1 | tee ../ci-out/smoke.txt
      - name: Memory and CPU at rest and after the smoke test
        if: always()
        run: |
          mkdir -p ci-out
          docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.MemPerc}}\t{{.CPUPerc}}\t{{.PIDs}}' | tee ci-out/stats-after-smoke.txt
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep doc-ts | tee ci-out/image-sizes.txt
      - name: Logs
        if: always()
        working-directory: platform-ts
        run: |
          mkdir -p ../ci-out
          docker compose ps -a > ../ci-out/compose-ps.txt
          docker compose logs --no-color --timestamps > ../ci-out/compose-logs.txt 2>&1
      - name: Tear down
        if: always()
        working-directory: platform-ts
        run: docker compose down -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: ci-out
          retention-days: 14

  # ---------------------------------------------------------------------------------------------------------------------------------------------
  # DOC's own end-to-end tests (tests/e2e/doc), on this build's stack and on DOC's FastAPI + Celery baseline, in the same run.
  # ---------------------------------------------------------------------------------------------------------------------------------------------
  build-baseline:
    name: Build DOC ${{ matrix.name }} image (baseline and test runner)
    needs: [plan]
    if: ${{ needs.plan.outputs.e2e_api == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: generated
            tag: wycliffeassociates/doc:local
          - name: usfmparser
            context: dotnet/USFMParserApi
            file: dotnet/USFMParserApi/Dockerfile
            tag: wycliffeassociates/doc-usfmparser:local
          - name: fileserver
            context: web
            file: web/Dockerfile
            tag: doc-fileserver:latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: DOC's Dockerfile without the Calibre step and the mypy lines
        if: ${{ matrix.name == 'api' }}
        run: bash platform-ts/ci/make-baseline-dockerfile.sh > "${{ runner.temp }}/Dockerfile.baseline"
      - name: Start timer
        run: echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file == 'generated' && format('{0}/Dockerfile.baseline', runner.temp) || matrix.file }}
          tags: ${{ matrix.tag }}
          outputs: type=docker,dest=${{ runner.temp }}/doc-${{ matrix.name }}.tar
          cache-from: type=gha,scope=doc-${{ matrix.name }}
          cache-to: type=gha,scope=doc-${{ matrix.name }},mode=max
      - name: Record build time and image size
        run: |
          end=$(date +%s)
          docker load -i "${{ runner.temp }}/doc-${{ matrix.name }}.tar" >/dev/null
          size=$(docker image inspect --format '{{.Size}}' "${{ matrix.tag }}")
          mkdir -p build-info
          printf '{"image":"doc-%s","build_seconds":%s,"size_bytes":%s}\n' "${{ matrix.name }}" "$((end - BUILD_START))" "$size" | tee "build-info/doc-${{ matrix.name }}.json"
          echo "| doc-${{ matrix.name }} | $((end - BUILD_START)) s | $((size / 1048576)) MB |" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: docimage-${{ matrix.name }}
          path: ${{ runner.temp }}/doc-${{ matrix.name }}.tar
          retention-days: 1
          compression-level: 1
      - uses: actions/upload-artifact@v4
        with:
          name: build-info-doc-${{ matrix.name }}
          path: build-info
          retention-days: 14

  e2e-api-ts:
    name: DOC e2e on the TypeScript stack (group ${{ matrix.group }}/3)
    needs: [plan, build, build-baseline]
    if: ${{ always() && needs.build.result == 'success' && needs.build-baseline.result == 'success' && needs.plan.outputs.e2e_api == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    env:
      IMAGE_TAG: local
      PYTEST_SPLITS: "3"
      PYTEST_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "{image-*,docimage-api}"
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - name: Load images
        run: for f in "${{ runner.temp }}"/images/*.tar; do docker load -i "$f"; done
      - name: Retag the stack's images for compose (tag ${{ env.IMAGE_TAG }})
        run: for i in api worker gateway frontend; do docker tag "doc-ts/$i:ci" "doc-ts/$i:local"; done
      - name: Start the stack
        working-directory: platform-ts
        run: |
          mkdir -p -m 0777 e2e-results ../ci-out
          docker compose up -d --no-build valkey volume-init api worker gateway
          bash ci/wait-healthy.sh 300 valkey api worker gateway
          bash ci/stats-sampler.sh ../ci-out/stats.csv 5 &
      - name: DOC's tests/e2e/doc against the TypeScript stack
        working-directory: platform-ts
        run: |
          start=$(date +%s)
          set +e
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml --profile e2e run --rm -T test-runner 2>&1 | tee ../ci-out/pytest.txt
          code=${PIPESTATUS[0]}
          echo "pytest_seconds=$(( $(date +%s) - start )) exit=$code" | tee ../ci-out/timing.txt "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Logs and state
        if: always()
        working-directory: platform-ts
        run: |
          mkdir -p ../ci-out
          cp e2e-results/*.xml ../ci-out/ 2>/dev/null || true
          docker compose ps -a > ../ci-out/compose-ps.txt
          docker compose logs --no-color --timestamps > ../ci-out/compose-logs.txt 2>&1
          docker run --rm -v platform-ts_output:/o:ro alpine sh -c 'ls /o | wc -l' > ../ci-out/documents-produced.txt 2>&1 || true
      - name: Tear down
        if: always()
        working-directory: platform-ts
        run: docker compose down -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-ts-${{ matrix.group }}
          path: ci-out
          retention-days: 14

  e2e-api-doc:
    name: DOC e2e on DOC's own FastAPI stack (group ${{ matrix.group }}/3)
    needs: [plan, build-baseline]
    if: ${{ always() && needs.build-baseline.result == 'success' && needs.plan.outputs.e2e_api == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    env:
      IMAGE_TAG: local
      PYTEST_SPLITS: "3"
      PYTEST_GROUP: ${{ matrix.group }}
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.api-test.yml -f platform-ts/ci/docker-compose.doc-baseline.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: docimage-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - name: Load images
        run: for f in "${{ runner.temp }}"/images/*.tar; do docker load -i "$f"; done
      - name: Prepare DOC's compose stack
        run: |
          mkdir -p -m 0777 e2e-results ci-out
          $COMPOSE up --no-start
      - name: DOC's tests/e2e/doc against DOC's own stack
        run: |
          start=$(date +%s)
          set +e
          # `run` starts the test runner's dependencies (waiting for their health checks), runs pytest, leaves the stack up
          ( bash platform-ts/ci/stats-sampler.sh ci-out/stats.csv 5 & echo $! > ci-out/sampler.pid )
          $COMPOSE run --rm -T test-runner 2>&1 | tee ci-out/pytest.txt
          code=${PIPESTATUS[0]}
          echo "pytest_seconds=$(( $(date +%s) - start )) exit=$code" | tee ci-out/timing.txt "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Logs and state
        if: always()
        run: |
          cp e2e-results/*.xml ci-out/ 2>/dev/null || true
          $COMPOSE ps -a > ci-out/compose-ps.txt
          $COMPOSE logs --no-color --timestamps --tail=2000 > ci-out/compose-logs.txt 2>&1
      - name: Tear down
        if: always()
        run: $COMPOSE down -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-doc-${{ matrix.group }}
          path: ci-out
          retention-days: 14

  e2e-report:
    name: DOC e2e pass table
    needs: [e2e-api-ts, e2e-api-doc]
    if: ${{ always() && (needs.e2e-api-ts.result != 'skipped' || needs.e2e-api-doc.result != 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-*-*
          path: results
      - name: Pass table (TypeScript stack against DOC's FastAPI baseline)
        run: |
          mkdir -p ci-out
          python3 - <<'PY'
          import pathlib, subprocess, sys
          root = pathlib.Path("results")
          def gather(prefix: str, dest: pathlib.Path) -> None:
              dest.mkdir(parents=True, exist_ok=True)
              for d in sorted(root.glob(prefix + "-*")):
                  for x in d.glob("junit*.xml"):
                      (dest / f"{d.name}-{x.name}").write_bytes(x.read_bytes())
          gather("e2e-ts", pathlib.Path("ts-xml"))
          gather("e2e-doc", pathlib.Path("doc-xml"))
          out = subprocess.run([sys.executable, "platform-ts/ci/e2e_table.py", "--ts", "ts-xml", "--doc", "doc-xml", "--out", "ci-out/e2e-table.md"], capture_output=True, text=True, check=False)
          print(out.stdout[:200], out.stderr[:2000])
          PY
          tee -a "$GITHUB_STEP_SUMMARY" < ci-out/e2e-table.md
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-table
          path: ci-out
          retention-days: 30
