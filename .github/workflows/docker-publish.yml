name: Docker

on: [push, pull_request]

# Cancel superseded runs on the same ref so they don't compete for runners/cache
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Build each image ONCE, save it as a tarball artifact, and reuse it everywhere.
  # Each image gets its own GHA cache scope so they stop overwriting each other.
  # ---------------------------------------------------------------------------
  Build-Images:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            context: .
            file: ./Dockerfile
            tag: wycliffeassociates/doc:local
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            tag: wycliffeassociates/doc-ui:local
          - name: usfmparser
            context: ./dotnet/USFMParserApi
            file: ./dotnet/USFMParserApi/Dockerfile
            tag: wycliffeassociates/doc-usfmparser:local
          - name: frontend-tests
            context: ./frontend
            file: ./frontend/testsDockerfile
            tag: wycliffeassociates/doc-ui-tests:local
          # fileserver has only `build: ./web` in docker-compose.yml, so compose
          # expects the image name <project>-<service>; project = checkout dir "doc"
          - name: fileserver
            context: ./web
            file: ./web/Dockerfile
            tag: doc-fileserver:latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          tags: ${{ matrix.tag }}
          outputs: type=docker,dest=${{ runner.temp }}/${{ matrix.name }}.tar
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Upload ${{ matrix.name }} image
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.name }}.tar
          retention-days: 1

  Test-API-Image:
    name: Test API image (group ${{ matrix.group }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [Build-Images]
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    env:
      # Interpolated into docker-compose.api-test.yml → pytest --splits/--group
      PYTEST_SPLITS: ${{ strategy.job-total }}
      PYTEST_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4

      - name: Download images
        uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true

      - name: Load images
        run: |
          docker load -i ${{ runner.temp }}/images/api.tar
          docker load -i ${{ runner.temp }}/images/usfmparser.tar
          docker load -i ${{ runner.temp }}/images/fileserver.tar

      # Pulls/builds only what isn't already loaded (e.g. redis, flower).
      - name: Prepare compose stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.api-test.yml \
            up --no-start

      # `run` starts test-runner's dependencies (waiting for health checks), runs
      # pytest, and returns pytest's exit code without tearing the stack down.
      - name: Test API image with docker-compose
        timeout-minutes: 20
        run: |
          docker compose -f docker-compose.yml -f docker-compose.api-test.yml \
            run --rm -T test-runner

      - name: Dump compose logs on failure
        if: failure()
        timeout-minutes: 3
        run: docker compose -f docker-compose.yml -f docker-compose.api-test.yml logs --no-color --timestamps --tail=500

  Test-Frontend-Image:
    name: Test Frontend image (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [Build-Images]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Consumed by docker-compose.frontend-test.yml → testsDockerfile --shard
      PLAYWRIGHT_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@v4

      - name: Download images
        uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true

      - name: Load images
        run: for f in ${{ runner.temp }}/images/*.tar; do docker load -i "$f"; done

      # Pulls/builds only what isn't already loaded (e.g. redis, flower).
      - name: Prepare compose stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.frontend-test.yml \
            up --no-start

      # `run` starts frontend-test-runner's dependencies (waiting for health checks),
      # runs Playwright, and returns its exit code without tearing the stack down.
      - name: Test frontend image with docker-compose
        timeout-minutes: 20
        run: |
          docker compose -f docker-compose.yml -f docker-compose.frontend-test.yml \
            run --rm -T frontend-test-runner

      - name: Dump compose logs on failure
        if: failure()
        timeout-minutes: 3
        run: docker compose -f docker-compose.yml -f docker-compose.frontend-test.yml logs --no-color --timestamps --tail=500

  Push-Images:
    name: Push images if this is a branch
    runs-on: ubuntu-24.04
    needs: [Test-API-Image, Test-Frontend-Image]
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: FranzDiebold/github-env-vars-action@v2
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Set DOC docker tags
        run: |
          echo "DOC_TAG_SHA=wycliffeassociates/doc:$GITHUB_SHA" >> $GITHUB_ENV
          echo "DOC_TAG_BRANCH=wycliffeassociates/doc:$CI_REF_NAME_SLUG" >> $GITHUB_ENV
          echo "DOC_TAG_LATEST=wycliffeassociates/doc:latest" >> $GITHUB_ENV
      - name: Set DOC-UI docker tags
        run: |
          echo "DOC_UI_TAG_SHA=wycliffeassociates/doc-ui:$GITHUB_SHA" >> $GITHUB_ENV
          echo "DOC_UI_TAG_BRANCH=wycliffeassociates/doc-ui:$CI_REF_NAME_SLUG" >> $GITHUB_ENV
          echo "DOC_UI_TAG_LATEST=wycliffeassociates/doc-ui:latest" >> $GITHUB_ENV
      - name: Set DOC USFM parser tags
        run: |
          echo "DOC_PARSER_TAG_SHA=wycliffeassociates/doc-usfmparser:$GITHUB_SHA" >> $GITHUB_ENV
          echo "DOC_PARSER_TAG_BRANCH=wycliffeassociates/doc-usfmparser:$CI_REF_NAME_SLUG" >> $GITHUB_ENV
          echo "DOC_PARSER_TAG_LATEST=wycliffeassociates/doc-usfmparser:latest" >> $GITHUB_ENV

      - name: Set version inside UI
        run: |
          PUBLIC_DOC_BUILD_TIMESTAMP=$(TZ='America/New_York' date +"%m-%d-%Y")
          echo "PUBLIC_DOC_BUILD_TIMESTAMP=$PUBLIC_DOC_BUILD_TIMESTAMP" >> $GITHUB_ENV
          echo "PUBLIC_DOC_VERSION=$CI_SHA_SHORT" >> $GITHUB_ENV

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOC_TAG_SHA }}
            ${{ env.DOC_TAG_BRANCH }}
            ${{ env.DOC_TAG_LATEST }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build and push UI image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.DOC_UI_TAG_SHA }}
            ${{ env.DOC_UI_TAG_BRANCH }}
            ${{ env.DOC_UI_TAG_LATEST }}
          build-args: |
            PUBLIC_DOC_VERSION_ARG=${{ env.PUBLIC_DOC_VERSION }}
            PUBLIC_DOC_BUILD_TIMESTAMP_ARG=${{ env.PUBLIC_DOC_BUILD_TIMESTAMP }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Build and push Parser image
        uses: docker/build-push-action@v6
        with:
          context: ./dotnet/USFMParserApi
          push: true
          tags: |
            ${{ env.DOC_PARSER_TAG_SHA }}
            ${{ env.DOC_PARSER_TAG_BRANCH }}
            ${{ env.DOC_PARSER_TAG_LATEST }}
          cache-from: type=gha,scope=usfmparser
          cache-to: type=gha,scope=usfmparser,mode=max

  Deploy-develop:
    name: Develop deploy on successful develop build
    needs: [Push-Images]
    if: ${{ github.ref_name == 'doc-dev.walink.org' }}
    runs-on: ubuntu-24.04
    environment: doc-dev.walink.org
    steps:
      - name: Configure 1Password Service Account
        uses: 1password/load-secrets-action@v1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DEV_DEPLOY_HOOK: op://DevOps/DEPLOY-doc-dev-walink-org-token/url

      - name: Call Deploy Webhook
        run: curl --fail ${{ env.DEV_DEPLOY_HOOK }}
